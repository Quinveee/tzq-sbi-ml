defaults: 
  - _base
  - _self_

key: ensemble

# When true, load checkpoints from the *_preprocessed run-dirs for models that
# have one (transformer, lloca, lgatr, lorentznet). mlp and histogram are
# unaffected since they have no preprocessed variant.
processed: false

# When true, after the LLR plots, rebuild each ML model and run a
# truth-vs-prediction correlation study over the *full* test set: ρ(t_true,
# t_pred) for score regression (one ρ per Wilson coefficient in 3D) and
# ρ(logr_true, logr_pred) for ratio regression, reported as mean ± std over the
# seeds, alongside MSE and MLE bias. Heavier than the LLR pass (re-runs model
# inference), so disable for quick LLR-only runs.
correlations: true

checkpoints_from:
  exp: ["histo", "ratio", "ratio", "ratio", "ratio", "ratio"]
  model: ["", "mlp", "transformer", "lloca", "lgatr", "lorentznet"]
  runs: [ [1,2,3], [1,2,3], [1,2,3], [1,2,3], [1,2,3], [1,2,3]]

